<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True Agency — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0a0a; --surface:#141414; --surface-2:#1a1a1a;
    --hairline:#272727; --gold:#c9a14a; --gold-bright:#e0bc6b;
    --ink:#f3f0e9; --muted:#8c8c8c; --red:#b5594f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 20px;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(255,255,255,0.015) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(255,255,255,0.015) 39px);
  }
  a{color:inherit;text-decoration:none;}

  .brand{display:flex;align-items:center;gap:12px;margin-bottom:54px;}
  .brand-mark{
    width:36px;height:36px;border:1px solid var(--gold);transform:rotate(45deg);
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark span{transform:rotate(-45deg);font-family:'Fraunces',serif;color:var(--gold);font-size:16px;}
  .brand-name{font-family:'Fraunces',serif;font-size:24px;}

  .panel{
    width:100%;max-width:420px;background:var(--surface);border:1px solid var(--hairline);
    padding:42px 38px;text-align:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);
    letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;
  }
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:26px;margin-bottom:10px;}
  .panel p{color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:30px;}

  .tabs{display:flex;border:1px solid var(--hairline);margin-bottom:26px;}
  .tab{flex:1;padding:10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:var(--surface-2);cursor:pointer;}
  .tab.active{color:var(--gold);background:var(--surface);}

  .field{text-align:left;margin-bottom:14px;}
  .field label{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px;}
  .field input,.field select{
    width:100%;background:var(--surface-2);border:1px solid var(--hairline);color:var(--ink);
    padding:11px 13px;font-family:'Inter',sans-serif;font-size:14px;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold);}

  .signin-btn{
    width:100%;background:var(--gold);color:#0a0a0a;padding:13px;font-size:14px;font-weight:600;
    margin-top:8px;letter-spacing:0.3px;transition:background .2s ease;cursor:pointer;border:none;
  }
  .signin-btn:hover{background:var(--gold-bright);}
  .signin-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .msg{font-family:'JetBrains Mono',monospace;font-size:12px;margin-top:14px;min-height:16px;}
  .msg.error{color:var(--red);}
  .msg.ok{color:var(--gold);}

  .foot-note{margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-align:center;}

  #signup-form{display:none;}
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-mark"><span>T</span></div>
    <div class="brand-name">True Agency</div>
  </div>

  <div class="panel">
    <div class="eyebrow">Account Access</div>
    <h1 id="panel-title">Welcome back.</h1>
    <p id="panel-sub">Sign in to your True Agency portal.</p>

    <div class="tabs">
      <div class="tab active" id="tab-signin" onclick="showTab('signin')">Sign In</div>
      <div class="tab" id="tab-signup" onclick="showTab('signup')">Create Account</div>
    </div>

    <form id="signin-form" onsubmit="handleSignIn(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="si-email" placeholder="you@trueagency.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="si-password" placeholder="••••••••" required>
      </div>
      <button class="signin-btn" type="submit" id="si-btn">Sign In</button>
      <div class="msg" id="si-msg"></div>
    </form>

    <form id="signup-form" onsubmit="handleSignUp(event)">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="su-name" placeholder="Jane Doe" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="su-email" placeholder="you@trueagency.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="su-password" placeholder="At least 6 characters" required minlength="6">
      </div>
      <div class="field">
        <label>Role</label>
        <select id="su-role">
          <option value="agent">Agent</option>
          <option value="owner">Agency Owner</option>
        </select>
      </div>
      <button class="signin-btn" type="submit" id="su-btn">Create Account</button>
      <div class="msg" id="su-msg"></div>
    </form>
  </div>

  <div class="foot-note">© 2026 True Agency</div>

<script>
  // ── CONFIGURE THESE TWO LINES WITH YOUR SUPABASE VALUES ──
  const SUPABASE_URL = "https://bgeecekvzowrfaoxtibm.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnZWVjZWt2em93cmZhb3h0aWJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MjY0MzgsImV4cCI6MjA5ODQwMjQzOH0.Lt-68RB4FwnD_hcMs5bTXdcE9MRIBjj-NXiZy5pBDmM";
  // ───────────────────────────────────────────────────────

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showTab(which){
    document.getElementById('tab-signin').classList.toggle('active', which==='signin');
    document.getElementById('tab-signup').classList.toggle('active', which==='signup');
    document.getElementById('signin-form').style.display = which==='signin' ? 'block' : 'none';
    document.getElementById('signup-form').style.display = which==='signup' ? 'block' : 'none';
    document.getElementById('panel-title').textContent = which==='signin' ? 'Welcome back.' : 'Join True Agency.';
    document.getElementById('panel-sub').textContent = which==='signin' ? 'Sign in to your True Agency portal.' : 'Create your account to get started.';
  }

  async function routeByRole(){
    const { data: { user } } = await sb.auth.getUser();
    if(!user) return;
    const { data: profile } = await sb.from('profiles').select('role').eq('id', user.id).single();
    if(profile && profile.role === 'owner'){
      window.location.href = 'owner.html';
    } else {
      window.location.href = 'agent.html';
    }
  }

  async function handleSignIn(e){
    e.preventDefault();
    const btn = document.getElementById('si-btn');
    const msg = document.getElementById('si-msg');
    btn.disabled = true; msg.textContent = ''; msg.className = 'msg';

    const email = document.getElementById('si-email').value;
    const password = document.getElementById('si-password').value;

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      msg.textContent = error.message;
      msg.className = 'msg error';
      btn.disabled = false;
      return;
    }
    msg.textContent = 'Signed in — redirecting...';
    msg.className = 'msg ok';
    await routeByRole();
  }

  async function handleSignUp(e){
    e.preventDefault();
    const btn = document.getElementById('su-btn');
    const msg = document.getElementById('su-msg');
    btn.disabled = true; msg.textContent = ''; msg.className = 'msg';

    const name = document.getElementById('su-name').value;
    const email = document.getElementById('su-email').value;
    const password = document.getElementById('su-password').value;
    const role = document.getElementById('su-role').value;

    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { name, role } }
    });

    if(error){
      msg.textContent = error.message;
      msg.className = 'msg error';
      btn.disabled = false;
      return;
    }

    msg.textContent = 'Account created — redirecting...';
    msg.className = 'msg ok';
    setTimeout(routeByRole, 800);
  }

  // If already signed in, skip straight to the right dashboard
  routeByRole();
</script>

</body>
</html>
